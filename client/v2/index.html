<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>🧱 Lego | Predictability of a lego set deal</title>
  </head>
  <body>
    <h1>Lego</h1>
    <section id="options">
      <div id="show">
        <label for="show-select">Show:</label>
        <select name="show" id="show-select">
          <option value="6">6</option>
          <option value="12">12</option>
          <option value="24">24</option>
        </select>
      </div>
      <div id="page">
        <label for="page-select">Go to page:</label>
        <select name="page" id="page-select"> </select>
      </div>
      <div id="filters">
        <label for="show-filter">Filter by :</label>
        <input type="checkbox" id="filter-discount" name="filter-discount" value="Discount">
        <label for="filter-discount">Discount</label>

        <input type="checkbox" id="filter-commented" name="filter-commented" value="Commented">
        <label for="filter-commented">Commented</label>

        <input type="checkbox" id="filter-hot-deals" name="filter-hot-deals" value="Hot deals">
        <label for="filter-hot-deals">Hot deals</label>
      </div>
      <div id="showFavorite">
        <label for="show-favorite">Show only favorites:</label>
        <input type="checkbox" id="show-favorite" name="show-favorite" value="Show only favorites">
      </div>

      <div id="sort">
        <label for="sort-select">Sort:</label>
        <select name="sort" id="sort-select">
          <option value="price-asc">Cheaper</option>
          <option value="price-desc">Expensive</option>
          <option value="date-asc">Recently published</option>
          <option value="date-desc">Anciently published</option>
        </select>
      </div>
    </section>
    <section id="lego">
      <h2>Lego sets</h2>
      <div>
        <label for="lego-set-id-select">Lego set id:</label>
        <select name="select-id" id="lego-set-id-select">
        </select> 
      </div>
    </section>
    <section id="indicators">
      <h2>Indicators for Deals</h2>
      <div>
        <span>Number of deals</span>
        <span id="nbDeals">0</span>
      </div>
      <div>
        <span>Number of sales</span>
        <span id="nbSales">0</span>
      </div>
      <div>
        <span>Average sale price</span>
        <span id="averageSalePrice">0</span>
      </div>
      <div>
        <span>p5 sales price value</span>
        <span id="p5value">0</span>
      </div>
      <div>
        <span>p25 sales price value</span>
        <span id="p25value">0</span>
      </div>
      <div>
        <span>p50 sales price value</span>
        <span id="p50value">0</span>
      </div>
      <div>
        <span>Lifetime value</span>
        <span id="lifetimeValue">0 days</span>
      </div>

      <h2>Indicators for Sales</h2>
      <div>
        <span>Number of current sales :</span>
        <span id="nbCurrentSales">0</span>
      </div>
      <div>
        <span>Number of past sales :</span>
        <span id="nbPastSales">0</span>
      </div>

    </section>
    <section id="deals"></section>
    <script type="text/javascript" charset="UTF-8" src="utils.js"></script>
    <script type="text/javascript" charset="UTF-8" src="portfolio.js"></script>
    <section id="sales"></section>
    <script type="text/javascript" charset="UTF-8" src="portfolioSales.js"></script>
  </body>
</html>
